- title: Developing Production ready GPT-2 Text Classifier From Scratch
  tags:
    - GPT-2 Transformer
    - Text Classification
    - Deep Learning
  links:
    - label: GitHub
      url: https://github.com/paymantohidifar/gpt2-text-classifier-from-scratch.git
  sections:
    - heading: ""
      description: >
        A GPT-2 architecture built from scratch and fine-tuned for text classification,
        inspired by Sebastian Raschka's Build a Large Language Model (From Scratch) book. The
        platform is designed around a decoupled, configuration-driven data pipeline that
        ingests any local or remote two-column dataset (text, label) without code
        modification, letting students and practitioners iteratively build and test
        different GPT-2 architectures. It also includes a complete suite of evaluation
        metrics and optional Distributed Data Parallel (DDP) support for scaling training
        seamlessly across multiple GPUs or nodes, and an optional flag for real-time model evaluation 
        using WandB API.
      images:
        - src: /static/assets/model_metrics.png
          caption: ""
          width: 400
          layout: side

- title: Deep Learning for Protein Function Prediction
  tags:
    - Protein Function Prediction
    - Multi-label Classification   
    - ESM2
    - Deep Learning
  links:
    - label: GitHub
      url: https://github.com/paymantohidifar/protein-function-deep-learning.git
  sections:
    - heading: ""
      description: >
        A neural network model that predicts protein function directly from amino acid
        sequence, using the CAFA (Critical Assessment of Functional Annotation) dataset
        for data preparation, training, and evaluation. Since individual proteins commonly
        participate in multiple physiological roles concurrently, the task is framed as
        multi-label classification, predicting functional associations for human proteins
        across 291 distinct Gene Ontology Molecular Function categories. Fixed-size protein
        embeddings are derived from a frozen, pretrained ESM-2 (150M parameter) backbone by
        mean-pooling the sequence dimension across its final hidden layer, and a lightweight
        two-hidden-layer Multi-Layer Perceptron (MLP) acts as a task-specific projection
        head, learning to map ESM-2's latent evolutionary representations into multi-label
        functional probability space without backpropagating into the language model. The platform 
        is designed to be modular and extensible, allowing users to easily swap in different model 
        architectures, loss functions, and evaluation metrics for experimentation.
      images:
        - src: /static/assets/model_prediction_high_level.png
          caption: "High level visualization of model prediction performance across validation set."
          width: 700
          layout: below

- title: "BioCanvas: A GUI for Multi-Modality Biological Experiment Data Analysis"
  tags:
    - Data Pipeline Automation
    - GUI
    - Statistical Analysis
    - Data Visualization
  links:
    - label: GitHub
      url: https://github.com/paymantohidifar/BioCanvas.git
  sections:
    - heading: ""
      description: >
        A comprehensive GUI for processing, consolidating, analyzing, and visualizing
        multi-modality biological experiment data, including fermentation, bioanalytical,
        biochemistry, and mass spectrometry process results from selected projects. Its modular 
        design allows users to easily add new data types and analysis workflows, and new projects
        without modifying the core codebase. BioCanvas runs as an ipywidgets-based Jupyter notebook 
        application, pulling raw experiment files from a local SQLite-backed store and turning them
        into consolidated tables, statistics with hypothesis testing, and plots via built-in statistical
        workflows, with no external services required. Synthetic data can also be generated for testing 
        and demonstration purposes, and the entire platform is containerized for easy deployment and reproducibility.
      images:
        - src: /static/assets/data_flow_diagram.png
          caption: "High level data pipeline and visualization workflow."
          width: 900
          layout: below

