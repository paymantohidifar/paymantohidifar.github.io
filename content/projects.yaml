- title: The Unconventional Cytoplasmic Sensing Mechanism for Ethanol Chemotaxis in Bacillus subtilis
  tags:
    - Unconventional Signaling
    - Protein Engineering
    - Molecular Dynamics Simulation
    - In-vitro Structural Analysis
  links:
    - label: GitHub
      url: https://github.com/paymantohidifar/alcohol-receptors
    - label: Paper
      url: https://doi.org/10.1128/mbio.02177-20
  sections:
    - heading: ""
      description: >
        Most chemoreceptors sense molecules through an extracellular domain, but we
        found that ethanol sensing in Bacillus subtilis relies on two unconventional
        sensors. McpB, a transmembrane receptor, binds ethanol not at its
        extracellular domain but within its cytoplasmic signaling domain; through
        protein engineering, we identified a single residue, Ala431, whose mutation
        to serine disrupts alcohol taxis, and molecular dynamics simulations showed
        this substitution tightens coiled-coil packing in the signaling domain,
        closing off the intermonomer pocket ethanol binds between the helices.
        HemAT, the main oxygen receptor, instead senses ethanol through its myoglobin-like
        domain, independent of its heme group. Since ethanol is neither metabolized
        nor beneficial to B. subtilis, these mechanisms likely evolved to help the
        cell locate alcohol-producing prey, and reveal that a chemoreceptor's sensory
        repertoire can extend beyond its canonical sensing domain.
      images:
        - src: /static/assets/alcohol_sensing.png
          caption: "(A) Chimeric and mutational analysis maps the McpB cytoplasmic residues that sense alcohols. (B) MD simulations of WT vs. A431S reveal reduced ethanol occupancy at the binding residues (red bars). (C) NMR and UV spectroscopy show ethanol binds directly within the HemAT sensing domain's helices."
          width: 900
          layout: below

- title: The Mechanism of Bidirectional pH Taxis in Bacillus subtilis
  tags:
    - Unconventional Signaling
    - Protein Engineering
    - Bioinformatics
  links:
    - label: GitHub
      url: https://github.com/paymantohidifar/pH-receptors
    - label: Paper
      url: https://doi.org/10.1128/jb.00491-19
  sections:
    - heading: ""
      description: >
        Bacillus subtilis senses pH gradients using four transmembrane chemoreceptors—McpA and
        TlpA for acidic environments, McpB and TlpB for alkaline ones—to migrate
        toward neutral conditions. Using sequence alignment and structural modeling,
        we designed chimeras between McpA and TlpB, the principal acid- and
        base-sensing receptors, to map the determinants of pH specificity down to
        four residues. Engineering a swap of these residues was sufficient to invert
        each receptor's response, converting the acid sensor into a base sensor and
        vice versa. Using combined protein engineering and comprehsive bioinformatics 
        analysis, we were able to proprose a model for sensing environmental pH in bacteria.
      images:
        - src: /static/assets/ph_sensing.png
          caption: "(A) Key residues involved in sensing environmental pH. (B) Conservation of pH-sensing amino acid residues in dCACHE_1 domains across bacteria. (C) Model for pH sensing mechanism in B. subtilis."
          width: 900
          layout: below

- title: A Modular Computational Framework for Multi-Scale Simulation of Chemotaxis in Complex Environments
  tags:
    - Signal Transduction
    - Multi-Scale Simulation
    - Finite Elements
  links:
    - label: Conference Paper
      url: https://aiche.confex.com/aiche/2015/webprogram/Paper433487.html
  sections:
    - heading: ""
      description: >
        Chemotaxis has long served as a model system for signal transduction in both 
        bacteria and eukaryotes. Existing chemotaxis models typically capture either 
        intracellular signaling dynamics or population-level behavior of swimming/migrating 
        cells in chemical gradients, rarely both. We built a modular, multi-scale computational 
        framework that bridges the two using a hybrid-continuum, particle-in-cell approach: 
        individual cells integrate their own intracellular pathway dynamics, their aggregate 
        effects are interpolated onto a stationary mesh, macroscale chemical fields are updated, 
        and the results are interpolated back to each cell. Validated against experimental 
        bacterial chemotaxis data with quantitative agreement, the framework generalizes to 
        any cell population interacting through chemical signaling.
      images:
        - src: /static/assets/particle_in_cell_algorithm.png
          caption: "Hybrid-continuum Particle-in-Cell algorithm."
          width: 576
          layout: side
        - src: /static/assets/cap_assay.gif
          caption: "3D simulation of individual cells swimming along the chemoattractant gradient released from the capillary tube."
          width: 360
          layout: below
        - src: /static/assets/aggregates.gif
          caption: "2D simulation of cells forming aggregates in response to signaling chemical they release."
          width: 280
          layout: below
